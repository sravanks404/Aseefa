name: suitapps
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.3
  url_launcher: ^6.3.2
  google_fonts: ^6.3.1
  sqflite: ^2.4.2
  path: ^1.9.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.4.21
  device_info_plus: ^10.1.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - assets/images/sp-logo.png
    - assets/icon/sp-logo.png
    - assets/images/login-bg-1.jpg
    - assets/icon/app_icon.png

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/sp-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/sp-logo.png"
  adaptive_icon_foreground_inset: 25
  remove_alpha_ios: true