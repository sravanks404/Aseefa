<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SuitApps Maintenance</title>
</head>
<body style="margin:0; padding:0; height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #e0eafc, #cfdef3); font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#333;">

  <div style="background:white; padding:40px 30px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.1); max-width:500px; width:90%; text-align:center;">
    <div style="font-size:42px; margin-bottom:10px;">🚧</div>
    <h1 style="font-size:28px; margin:10px 0;">SuitApps is Under Maintenance</h1>
    <p style="font-size:18px; margin:0 0 10px;">We’re doing some quick improvements.</p>
    <p style="font-size:17px; margin-bottom:25px;">We'll be back by <strong style="color:#d9534f;">5:00 PM</strong> today.</p>

    <div style="font-size:22px; font-weight:600; margin-bottom:10px;">Time Remaining</div>
    <div id="countdown" style="font-size:30px; font-weight:bold; color:#2d4ba9; letter-spacing:2px;">--:--:--</div>

    <p style="font-size:14px; color:#666; margin-top:30px;">Thanks for your patience & understanding.</p>
  </div>

  <script>
    function updateCountdown() {
      const now = new Date();
      const target = new Date();
      target.setHours(17, 0, 0, 0); // Set to 5:00 PM

      if (now > target) {
        document.getElementById("countdown").innerText = "00:00:00";
        return;
      }

      const diff = target - now;
      const hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
      const minutes = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
      const seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

      document.getElementById("countdown").innerText = `${hours}:${minutes}:${seconds}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
